<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gicela Vargas · Tarjeta digital</title>
  <meta name="description" content="Gicela Vargas — desarrollo web a medida. Style Factory y NordicStore.">
  <meta property="og:title" content="Gicela Vargas · Desarrollo web">
  <meta property="og:description" content="Reservas, tiendas en línea y APIs. Toca un proyecto para verlo.">
  <meta property="og:url" content="https://enithv.github.io/portfolio-website/tarjeta.html">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:500,600,700,800" rel="stylesheet">
  <style>
    :root {
      --ink: #0c1929;
      --paper: #f4efe8;
      --gold: #c4a77d;
      --wood: #6e4424;
      --navy: #132337;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(196, 167, 125, 0.28), transparent 50%),
        radial-gradient(ellipse 70% 40% at 100% 100%, rgba(37, 99, 235, 0.18), transparent 45%),
        #0c1929;
      color: var(--paper);
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
      min-height: 100dvh;
    }
    .stage { perspective: 1200px; width: min(420px, 100%); }
    .card {
      position: relative;
      border-radius: 28px;
      background: linear-gradient(165deg, #1a2838 0%, #0c1929 55%, #16110e 100%);
      border: 1px solid rgba(196, 167, 125, 0.35);
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 28px 24px 22px;
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.07) 48%, transparent 56%);
      transform: translateX(-60%);
      pointer-events: none;
    }
    .card:hover::before { animation: shine 1.1s ease; }
    @keyframes shine {
      to { transform: translateX(60%); }
    }
    .top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }
    .photo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      background: #243044;
    }
    .photo-fallback {
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--gold);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
    }
    .role {
      margin: 0;
      color: #c8b8a4;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .pitch {
      margin: 0 0 20px;
      color: #d9d0c6;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .projects { display: grid; gap: 10px; }
    .project {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 16px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(196, 167, 125, 0.22);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }
    .project:hover, .project:focus-visible {
      transform: translateY(-2px);
      background: rgba(196, 167, 125, 0.12);
      border-color: var(--gold);
      outline: none;
    }
    .project strong {
      display: block;
      font-size: 1.05rem;
      color: #fff8f0;
    }
    .project span {
      display: block;
      margin-top: 3px;
      font-size: 0.8rem;
      color: #b8a898;
    }
    .hint {
      margin: 14px 0 0;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a7b6c;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }
    .icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(196, 167, 125, 0.25);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .icon:hover { background: rgba(196, 167, 125, 0.18); color: #fff; }
    .share {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--wood);
      color: #fff8f0;
    }
    .share:hover { background: #4f2f18; }
    .lang {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }
    .lang button {
      background: transparent;
      border: 0;
      color: #b8a898;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 8px;
    }
    .lang button.active { color: var(--gold); }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #fff8f0;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card::before { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <article class="card" id="card">
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" class="active" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="top">
        <img class="photo" src="Foto_Port.png" alt="Gicela Vargas" width="76" height="76" id="photo">
        <div>
          <h1>Gicela Vargas</h1>
          <p class="role" data-i18n="role">Desarrollo web a medida</p>
        </div>
      </div>
      <p class="pitch" data-i18n="pitch">Apps con Java y Spring Boot: reservas, tiendas en línea y APIs documentadas. Toca un proyecto para verlo en vivo.</p>
      <div class="projects">
        <a class="project" href="https://enithv.github.io/stylefactory/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Style Factory">
          <strong>Style Factory</strong>
          <span data-i18n="sf">Reservas y agenda en línea</span>
        </a>
        <a class="project" href="https://enithv.github.io/NordicStore/" target="_blank" rel="noopener noreferrer" aria-label="Abrir NordicStore">
          <strong>NordicStore</strong>
          <span data-i18n="ns">Tienda en línea</span>
        </a>
      </div>
      <p class="hint" data-i18n="hint">Toca el nombre · no hace falta copiar el enlace</p>
      <div class="actions">
        <a class="icon" href="mailto:ingegvargas@gmail.com" aria-label="Correo">✉</a>
        <a class="icon" href="https://www.linkedin.com/in/gicelavargas/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
        <a class="icon" href="https://enithv.github.io/portfolio-website/" target="_blank" rel="noopener noreferrer" aria-label="Portafolio" data-i18n-title="folio">GV</a>
      </div>
      <button type="button" class="share" id="share" data-i18n="share">Compartir tarjeta</button>
    </article>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    var copy = {
      es: {
        role: "Desarrollo web a medida",
        pitch: "Apps con Java y Spring Boot: reservas, tiendas en línea y APIs documentadas. Toca un proyecto para verlo en vivo.",
        sf: "Reservas y agenda en línea",
        ns: "Tienda en línea",
        hint: "Toca el nombre · no hace falta copiar el enlace",
        share: "Compartir tarjeta",
        copied: "Enlace de la tarjeta copiado"
      },
      en: {
        role: "Custom web development",
        pitch: "Java and Spring Boot apps: bookings, online stores, and documented APIs. Tap a project to open the live demo.",
        sf: "Online bookings and scheduling",
        ns: "Online store",
        hint: "Tap the name · no need to copy the URL",
        share: "Share card",
        copied: "Card link copied"
      }
    };
    var lang = "es";
    function applyLang() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = copy[lang][el.getAttribute("data-i18n")];
      });
      document.querySelectorAll(".lang button").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
    }
    document.querySelectorAll(".lang button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        lang = btn.getAttribute("data-lang");
        applyLang();
      });
    });
    var card = document.getElementById("card");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce) {
      card.addEventListener("pointermove", function (ev) {
        var r = card.getBoundingClientRect();
        var x = (ev.clientX - r.left) / r.width - 0.5;
        var y = (ev.clientY - r.top) / r.height - 0.5;
        card.style.transform = "rotateY(" + (x * 10) + "deg) rotateX(" + (-y * 10) + "deg)";
      });
      card.addEventListener("pointerleave", function () {
        card.style.transform = "rotateY(0) rotateX(0)";
      });
    }
    var photo = document.getElementById("photo");
    if (photo) {
      photo.addEventListener("error", function () {
        var fallback = document.createElement("div");
        fallback.className = "photo photo-fallback";
        fallback.textContent = "GV";
        fallback.setAttribute("aria-hidden", "true");
        photo.replaceWith(fallback);
      });
    }
    document.getElementById("share").addEventListener("click", async function () {
      var url = location.href.split("#")[0];
      try {
        if (navigator.share) {
          await navigator.share({ title: "Gicela Vargas", text: copy[lang].pitch, url: url });
          return;
        }
        await navigator.clipboard.writeText(url);
        toast.textContent = copy[lang].copied;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 2200);
      } catch (e) {
        await navigator.clipboard.writeText(url);
        toast.textContent = copy[lang].copied;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 2200);
      }
    });
  </script>
</body>
</html>
